name: HMAL bench (B1-B5, B7)

# Execução confirmatória: disparada só pelo commit de congelamento que cria ou altera lab/bench/matrix_v04.json.
# Execução de desenvolvimento: manual (workflow_dispatch) com dev_seed preenchido; a matriz é gerada na hora,
# com sementes disjuntas da matriz oficial, e o resultado sai marcado como não definitivo.
on:
  push:
    branches: [lab/bench-run]
    paths: ["lab/bench/matrix_v04.json"]
  workflow_dispatch:
    inputs:
      receiver:
        description: "receptor (v1, v2, v3)"
        default: "v3"
      criteria:
        description: "versão dos critérios (0.3.1 ou 0.4.0)"
        default: "0.4.0"
      dev_seed:
        description: "semente de uma matriz de desenvolvimento (vazio = matriz oficial dos critérios)"
        default: ""
      dev_noise_offset:
        description: "deslocamento das sementes de ruído da matriz de desenvolvimento"
        default: "500000000"

env:
  RECEIVER: ${{ inputs.receiver || 'v3' }}
  CRITERIA: ${{ inputs.criteria || '0.4.0' }}
  DEV_SEED: ${{ inputs.dev_seed || '' }}
  DEV_OFFSET: ${{ inputs.dev_noise_offset || '500000000' }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        mode: [hf, lf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Verify matrices
        run: pytest tests/test_bench_matrix.py tests/test_bench_tools.py -q
      - name: Run bench
        run: |
          EXTRA=""
          if [ -n "$DEV_SEED" ]; then
            python lab/bench/make_matrix.py --version "dev-$DEV_SEED" --seed "$DEV_SEED" --noise-offset "$DEV_OFFSET" --out /tmp/matrix_dev.json
            EXTRA="--matrix /tmp/matrix_dev.json --smoke"
          fi
          python lab/bench/run_bench.py --modes ${{ matrix.mode }} --workers 4 --receiver "$RECEIVER" --criteria "$CRITERIA" --out out $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ env.RECEIVER }}-${{ env.CRITERIA }}${{ env.DEV_SEED && '-dev' || '' }}-${{ matrix.mode }}
          path: out/

  aggregate:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate hf + lf and apply TRL rule
        run: |
          P="bench-$RECEIVER-$CRITERIA${DEV_SEED:+-dev}"
          python lab/bench/aggregate.py "artifacts/$P-hf" "artifacts/$P-lf" aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-aggregate-${{ env.RECEIVER }}-${{ env.CRITERIA }}${{ env.DEV_SEED && '-dev' || '' }}
          path: aggregate.json
