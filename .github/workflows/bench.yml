name: HMAL bench (B1-B5, B7)

# Dois caminhos separados:
# - confirmatório: SÓ o evento push do commit de congelamento que cria ou altera lab/bench/matrix_v04.json, com o
#   receptor e os critérios registrados em lab/bench/FREEZE_v0.4.json;
# - desenvolvimento: SÓ disparo manual (workflow_dispatch), com dev_seed obrigatório; a matriz é gerada na hora,
#   copiada para o artefato e a execução é sempre marcada como não definitiva (--smoke).
# Não existe caminho manual para uma rodada definitiva.
on:
  push:
    branches: [lab/bench-run]
    paths: ["lab/bench/matrix_v04.json"]
  workflow_dispatch:
    inputs:
      receiver:
        description: "receptor (v1, v2, v3)"
        required: true
        default: "v3"
      criteria:
        description: "versão dos critérios (0.3.1 ou 0.4.0)"
        required: true
        default: "0.4.0"
      dev_seed:
        description: "semente da matriz de desenvolvimento (obrigatória)"
        required: true
      dev_noise_offset:
        description: "deslocamento das sementes de ruído da matriz de desenvolvimento (abaixo de 1000000000)"
        required: true
        default: "500000000"

# Privilégio mínimo: os jobs só leem o repositório e enviam artefatos.
permissions:
  contents: read

jobs:
  # Cada modo é dividido em seis partes paralelas para caber no limite de tempo por job: os ensaios B1, B2,
  # B4, B5 e B7 numa parte, e cada condição do B3 numa parte. A junção (merge_parts.py) confere que o env é
  # idêntico em todas as partes e que cada ensaio e cada condição aparecem exatamente uma vez.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        mode: [hf, lf]
        part: [base, k1, k2, k3, worst_pair_0, worst_pair_1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c lab/bench/constraints.txt -e .
          pip install pytest
      - name: Verify matrices and tools
        run: pytest tests/test_bench_matrix.py tests/test_bench_tools.py tests/test_bench_integrity.py tests/test_bench_merge.py tests/test_bench_freeze.py -q
      - name: Resolve run kind
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          IN_RECEIVER: ${{ inputs.receiver }}
          IN_CRITERIA: ${{ inputs.criteria }}
          IN_SEED: ${{ inputs.dev_seed }}
          IN_OFFSET: ${{ inputs.dev_noise_offset }}
        run: python lab/bench/resolve_run.py
      - name: Run bench part
        env:
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = "base" ]; then SEL="--tests B1,B2,B4,B5,B7"; else SEL="--tests B3 --b3-conditions $PART"; fi
          python lab/bench/run_bench.py --modes ${{ matrix.mode }} --workers 4 ${{ steps.kind.outputs.args }} $SEL --out out
      - name: Keep development matrix with the results
        if: steps.kind.outputs.kind == 'dev'
        run: cp /tmp/matrix_dev.json out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: part-${{ matrix.mode }}-${{ matrix.part }}
          path: out/

  merge-and-aggregate:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.17"
      - name: Install
        run: pip install -c lab/bench/constraints.txt -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: parts
          pattern: part-*
      - name: Merge parts per mode and apply TRL rule
        run: |
          set -e
          for m in hf lf; do
            python lab/bench/merge_parts.py "results/$m" parts/part-$m-base parts/part-$m-k1 parts/part-$m-k2 parts/part-$m-k3 parts/part-$m-worst_pair_0 parts/part-$m-worst_pair_1
          done
          if ls parts/*/matrix_dev.json >/dev/null 2>&1; then
            test "$(sha256sum parts/*/matrix_dev.json | cut -d' ' -f1 | sort -u | wc -l)" = "1"
            cp "$(ls parts/*/matrix_dev.json | head -1)" results/
          fi
          python lab/bench/aggregate.py results/hf results/lf results/aggregate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: results/
