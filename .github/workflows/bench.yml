name: HMAL bench (B1-B5, B7) receiver v2

on:
  push:
    branches: [lab/bench-run]
    paths: ["lab/bench/run_bench.py", "lab/bench/receiver.py", ".github/workflows/bench.yml"]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        mode: [hf, lf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Verify matrix
        run: |
          pip install pytest
          pytest tests/test_bench_matrix.py -q
      - name: Run definitive bench
        run: python lab/bench/run_bench.py --modes ${{ matrix.mode }} --workers 4 --receiver v2
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results-v2-${{ matrix.mode }}
          path: lab/bench/results/
