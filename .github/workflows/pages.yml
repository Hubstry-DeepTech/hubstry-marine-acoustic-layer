name: HMAL Lab (GitHub Pages)

# Publica a página só a partir do ramo principal. Os dados são gerados no build a partir das evidências
# versionadas (site/build_data.py confere o SHA-256 de cada arquivo do manifesto e executa o agregador).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "lab/bench/results/**"
      - "lab/bench/aggregate.py"
      - "lab/BENCH_CRITERIA*.md"
      - "lab/PREREGISTRATION.md"
      - "docs/SPECIFICATION.md"
      - "docs/ETHICS_GUIDELINES.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: |
          pip install pillow pytest
          cd site && npm ci
      - name: Test data pipeline
        run: pytest tests/test_site_build.py -q
      - name: Build data from versioned evidence
        run: python site/build_data.py
      - name: Build page
        run: cd site && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
