name: HMAL Lab (GitHub Pages)

# Publica a página só a partir do ramo principal. Os dados são gerados no build a partir das evidências
# versionadas (site/build_data.py confere o SHA-256 de cada arquivo do manifesto e executa o agregador).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "lab/bench/results/**"
      - "lab/bench/aggregate.py"
      - "lab/BENCH_CRITERIA*.md"
      - "lab/PREREGISTRATION.md"
      - "docs/SPECIFICATION.md"
      - "docs/ETHICS_GUIDELINES.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: |
          pip install pillow pytest
          cd site && npm ci
      - name: Test data pipeline
        run: pytest tests/test_site_build.py -q
      - name: Build data from versioned evidence
        run: python site/build_data.py
      - name: Build page
        run: cd site && npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
