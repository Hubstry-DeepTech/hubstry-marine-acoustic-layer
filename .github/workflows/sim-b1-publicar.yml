name: SIM-MCA-001 Bloco 1 (publicar resultado da rodada final)

# Copia para o branch o artefato da execução 41890176596 (rodada final cal/ver, commit 31a341e),
# sem recalcular nada. Dispara quando este arquivo é alterado no branch research/mca-001.

on:
  push:
    branches: [research/mca-001]
    paths: [".github/workflows/sim-b1-publicar.yml"]

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: "41890176596"

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mca-001
      - uses: actions/download-artifact@v4
        with:
          name: block1-rodada-final-cal-ver
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artefato
      - name: Conferir e copiar
        run: |
          find artefato -type f
          cp artefato/block1_rodada_final_cal_ver.json lab/sim_mca001/results/
          cp artefato/block1_rodada_final_cal_ver.proveniencia.txt lab/sim_mca001/results/
          cat lab/sim_mca001/results/block1_rodada_final_cal_ver.proveniencia.txt
          sha256sum lab/sim_mca001/results/block1_rodada_final_cal_ver.json
      - name: Commit
        env:
          GIT_AUTHOR_NAME: Guilherme Machado
          GIT_AUTHOR_EMAIL: guilhermemachado.ceo@hubstry.dev
          GIT_COMMITTER_NAME: Claude
          GIT_COMMITTER_EMAIL: noreply@anthropic.com
        run: |
          git add lab/sim_mca001/results/block1_rodada_final_cal_ver.json \
                  lab/sim_mca001/results/block1_rodada_final_cal_ver.proveniencia.txt
          git commit -m "lab: resultado da rodada final cal/ver do Bloco 1 (execução ${SOURCE_RUN_ID})" \
                     -m "Artefato copiado sem alteração da execução ${SOURCE_RUN_ID} do workflow sim-b1.yml (commit 31a341e). A partição val não foi executada." \
                     -m "Generated by Claude"
          git push origin HEAD:research/mca-001
